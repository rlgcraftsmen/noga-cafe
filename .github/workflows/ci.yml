name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly re-validation: a delivered client site never gets pushed again,
    # so this is the only thing that catches dependency/browser drift.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Template repo must not contain per-client artifacts
        # docs/concept.md and docs/design-review.md are written per client —
        # one stray commit in the template pollutes every future clone.
        if: github.repository == 'RLGTEAM/BusinessTemplate'
        run: |
          if [ -e docs/concept.md ] || [ -e docs/design-review.md ]; then
            echo "::error::docs/concept.md / docs/design-review.md are per-client artifacts and must never exist in the template"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # Skips with exit 0 in the template (no docs/concept.md); catches a
      # malformed docs/portfolio.json on every push.
      - run: npm run validate:divergence
      - run: npm run test:ltr-build

  e2e:
    name: Playwright + axe smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # @visual snapshots are gitignored, per-machine baselines — CI has none,
      # so test:e2e itself excludes the visual suite (--grep-invert @visual);
      # it's local-only, not a CI-specific exclusion.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (LCP/INP/CLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
